
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Monitoraggio Iscritti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <img src="fast-video-nero_page-0001.jpg" alt="Logo Fast Video" class="logo">
    <h1>Monitoraggio Iscritti Zoom</h1>
    <form id="loginForm">
        <input type="password" id="password" placeholder="Inserisci password" required>
        <button type="submit">Accedi</button>
    </form>
    <div id="tableContainer" style="display:none;">
        <table id="registrantsTable">
            <thead>
                <tr><th>Nome</th><th>Cognome</th><th>Email</th><th>Link personale</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const pw = document.getElementById('password').value;
            if (pw !== "zoom2024") {
                alert("Password errata");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (!id) {
                alert("ID webinar mancante nell'URL");
                return;
            }

            try {
                const response = await fetch(`https://zoom-backend-la4b.onrender.com/api/registrants?id=${id}`);
                const data = await response.json();

                if (data.error) {
                    alert("Errore nel recupero dei dati dal backend.");
                    return;
                }

                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('tableContainer').style.display = 'block';

                const tbody = document.querySelector('#registrantsTable tbody');
                data.forEach(user => {
                    const row = `<tr>
                        <td>${user.first_name}</td>
                        <td>${user.last_name}</td>
                        <td>${user.email}</td>
                        <td><a href="${user.join_url}" target="_blank">Partecipa</a></td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (err) {
                alert("Errore nel recupero dei dati dal backend.");
            }
        });
    </script>
</body>
</html>
