<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitoraggio Iscritti Webinar</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fc;
      margin: 0;
      padding: 2rem;
      color: #333;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    img {
      max-width: 200px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }
    .login {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0 1rem 0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #0073e6;
      color: white;
      padding: 0.8rem 1.2rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    table {
      width: 100%;
      margin-top: 2rem;
      border-collapse: collapse;
    }
    th, td {
      padding: 0.75rem;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
    }
    .hidden {
      display: none;
    }
    a {
      color: #0073e6;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <header>
    <img src="fast-video-nero_page-0001.jpg" alt="Logo Fast Video Produzioni" />
    <h1>Monitoraggio Iscritti Webinar</h1>
  </header>

  <div class="login" id="loginBox">
    <input type="password" id="password" placeholder="Inserisci la password di accesso" />
    <button onclick="checkPassword()">Accedi</button>
  </div>

  <div id="tableBox" class="hidden">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>Cognome</th>
          <th>Email</th>
          <th>Link personale</th>
        </tr>
      </thead>
      <tbody id="registrantsTable"></tbody>
    </table>
  </div>

  <script>
    const PASSWORD = "fastvideo";
    const webinarId = new URLSearchParams(window.location.search).get("id");

    function checkPassword() {
      const input = document.getElementById("password").value;
      if (input === PASSWORD) {
        document.getElementById("loginBox").classList.add("hidden");
        if (!webinarId) {
          alert("⚠️ ID del webinar mancante nell'URL.");
          return;
        }
        fetchData();
      } else {
        alert("❌ Password errata.");
      }
    }

    async function fetchData() {
      try {
        const res = await fetch(`https://zoom-backend-la4b.onrender.com/registrants?webinar_id=${webinarId}`);
        const data = await res.json();
        const table = document.getElementById("registrantsTable");

        data.forEach(p => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${p.first_name || ""}</td>
            <td>${p.last_name || ""}</td>
            <td>${p.email}</td>
            <td><a href="${p.join_url}" target="_blank">Vai al link</a></td>
          `;
          table.appendChild(row);
        });

        document.getElementById("tableBox").classList.remove("hidden");
      } catch (err) {
        alert("Errore nel recupero dei dati dal backend.");
        console.error(err);
      }
    }
  </script>
</body>
</html>
