<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitoraggio Iscritti - Fast Video</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"/>
  <style>
    body {
      margin: 0;
      font-family: 'Roboto', sans-serif;
      background-color: #f5f5f5;
    }

    header {
      background-color: #000;
      color: white;
      padding: 10px 20px;
      display: flex;
      align-items: center;
    }

    header img {
      height: 60px;
      margin-right: 20px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0;
    }

    main {
      padding: 20px;
    }

    form {
      margin-bottom: 20px;
    }

    input[type="password"], input[type="text"] {
      padding: 10px;
      font-size: 1rem;
      width: 300px;
      margin-right: 10px;
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #ccc;
      text-align: left;
    }

    th {
      background-color: #000;
      color: white;
    }

    #error {
      color: red;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <img src="fast-video-nero_page-0001.jpg" alt="Fast Video Produzioni Logo" />
    <h1>Monitoraggio Iscritti Webinar</h1>
  </header>

  <main>
    <div id="form-container">
      <p>Inserisci la password per accedere:</p>
      <input type="password" id="password" placeholder="Password"/>
      <button onclick="checkPassword()">Accedi</button>
      <p id="error"></p>
    </div>

    <div id="table-container" style="display: none;">
      <table id="registrants-table">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Cognome</th>
            <th>Email</th>
            <th>Link personale</th>
          </tr>
        </thead>
        <tbody id="registrants-body">
        </tbody>
      </table>
    </div>
  </main>

  <script>
    const PASSWORD = "fv2024";

    function checkPassword() {
      const input = document.getElementById("password").value;
      if (input === PASSWORD) {
        document.getElementById("form-container").style.display = "none";
        document.getElementById("table-container").style.display = "block";
        fetchRegistrants();
      } else {
        document.getElementById("error").innerText = "❌ Password errata. Riprova.";
      }
    }

    function getWebinarIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    async function fetchRegistrants() {
      const id = getWebinarIdFromUrl();
      if (!id) {
        document.getElementById("registrants-body").innerHTML = '<tr><td colspan="4">❌ Errore: ID del webinar mancante nell’URL.</td></tr>';
        return;
      }

      try {
        const response = await fetch(`https://zoom-backend-la4b.onrender.com/api/registrants?id=${id}`);
        if (!response.ok) {
          throw new Error("Errore nel recupero dei dati dal backend.");
        }
        const registrants = await response.json();

        const tbody = document.getElementById("registrants-body");
        tbody.innerHTML = "";

        registrants.forEach(r => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${r.first_name}</td>
            <td>${r.last_name}</td>
            <td>${r.email}</td>
            <td><a href="${r.join_url}" target="_blank">Partecipa</a></td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        document.getElementById("registrants-body").innerHTML = `<tr><td colspan="4">${error.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
