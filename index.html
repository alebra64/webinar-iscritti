<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Monitoraggio Iscritti Zoom</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f4f4f4;
            text-align: center;
        }
        img {
            width: 250px;
            margin-bottom: 20px;
        }
        #passwordForm, #registrantsTable {
            margin-top: 20px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 90%;
        }
        th, td {
            border: 1px solid #aaa;
            padding: 10px;
            background-color: white;
        }
        th {
            background-color: #333;
            color: white;
        }
        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <img src="fast-video-nero_page-0001.jpg" alt="Logo Fast Video Produzioni">

    <div id="passwordForm">
        <h2>Inserisci la password</h2>
        <input type="password" id="passwordInput" placeholder="Password">
        <button onclick="checkPassword()">Accedi</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <div id="registrantsTable" style="display: none;">
        <h2>Elenco Iscritti</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Cognome</th>
                    <th>Email</th>
                    <th>Link personale</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
        <p id="totalCount" style="font-weight: bold; margin-top: 10px;"></p>
        
        <div class="error" id="fetchError"></div>
    </div>

    <script>
        const PASSWORD = "fastvideo2025";

        function getWebinarIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get("webinar_id");
        }

        function checkPassword() {
            const input = document.getElementById("passwordInput").value;
            if (input === PASSWORD) {
                document.getElementById("passwordForm").style.display = "none";
                loadRegistrants();
            } else {
                document.getElementById("errorMsg").innerText = "Password errata.";
            }
        }

        async function loadRegistrants() {
            const webinarId = getWebinarIdFromURL();
            if (!webinarId) {
                document.getElementById("fetchError").innerText = "ID del webinar mancante nell'URL.";
                return;
            }

            try {
                const response = await fetch(`https://zoom-backend-la4b.onrender.com/api/registrants?id=${webinarId}`);
                const data = await response.json();

                if (data.error) {
                    document.getElementById("fetchError").innerText = "Errore nel recupero dei dati dal backend.";
                    return;
                }

                const tbody = document.getElementById("tableBody");
                tbody.innerHTML = "";

                data.forEach(person => {
                    const row = `<tr>
                        <td>${person.first_name}</td>
                        <td>${person.last_name}</td>
                        <td>${person.email}</td>
                        <td><a href="${person.join_url}" target="_blank">Entra</a></td>
                    </tr>`;
                    tbody.innerHTML += row;
                }); 
                document.getElementById("totalCount").textContent = `Totale iscritti: ${data.length}`;


                document.getElementById("registrantsTable").style.display = "block";
            } catch (error) {
                document.getElementById("fetchError").innerText = "Errore nel recupero dei dati dal backend.";
            }
        }
    </script>
</body>
</html>
