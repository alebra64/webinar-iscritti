<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitoraggio Iscritti</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
    }
    img {
      max-width: 300px;
      margin-bottom: 20px;
    }
    .lock {
      font-size: 1.4rem;
      margin-bottom: 10px;
    }
    input[type="password"] {
      padding: 8px;
      width: 250px;
      font-size: 1rem;
    }
    button {
      margin-top: 10px;
      padding: 8px 16px;
      font-size: 1rem;
      cursor: pointer;
    }
    .error {
      color: red;
      margin-top: 10px;
    }
    table {
      margin: 0 auto;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
    }
    th {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>
  <img src="fast-video-logo.jpg" alt="Fast Video Produzioni Logo" />

  <div id="login-section">
    <div class="lock">🔒 <strong>Accesso protetto</strong></div>
    <input type="password" id="password" placeholder="Inserisci la password" />
    <br />
    <button onclick="checkPassword()">Accedi</button>
    <div class="error" id="error-message"></div>
  </div>

  <div id="table-section" style="display:none;">
    <h2>Elenco Iscritti</h2>
    <table id="registrants-table">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Cognome</th>
          <th>Email</th>
          <th>Link personale</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <script>
    const PASSWORD = "fast2024";  // Puoi cambiarla se serve
    const backendUrl = "https://zoom-backend-la4b.onrender.com";

    function getWebinarId() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    function checkPassword() {
      const input = document.getElementById("password").value;
      const errorDiv = document.getElementById("error-message");
      if (input !== PASSWORD) {
        errorDiv.textContent = "Password errata.";
        return;
      }

      const webinarId = getWebinarId();
      if (!webinarId) {
        errorDiv.textContent = "ID del webinar mancante nell’URL.";
        return;
      }

      document.getElementById("login-section").style.display = "none";
      document.getElementById("table-section").style.display = "block";
      fetchRegistrants(webinarId);
    }

    function fetchRegistrants(webinarId) {
      fetch(`${backendUrl}/registrants?webinar_id=${webinarId}`)
        .then(response => {
          if (!response.ok) throw new Error("Errore nel recupero dei dati dal backend.");
          return response.json();
        })
        .then(data => {
          const tbody = document.querySelector("#registrants-table tbody");
          tbody.innerHTML = "";
          data.forEach(person => {
            const row = document.createElement("tr");
            row.innerHTML = `
              <td>${person.first_name}</td>
              <td>${person.last_name}</td>
              <td>${person.email}</td>
              <td><a href="${person.join_url}" target="_blank">Vai al link</a></td>
            `;
            tbody.appendChild(row);
          });
        })
        .catch(error => {
          const errorDiv = document.getElementById("error-message");
          errorDiv.textContent = error.message;
        });
    }
  </script>
</body>
</html>

    </script>
</body>
</html>
