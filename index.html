<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Monitoraggio Iscritti Zoom</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      text-align: center;
      padding: 20px;
    }
    img {
      max-width: 300px;
      height: auto;
    }
    input[type="password"] {
      padding: 10px;
      width: 200px;
      margin: 20px 10px;
    }
    button {
      padding: 10px 20px;
    }
    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 90%;
      max-width: 1000px;
      background-color: #fff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
    }
    th {
      background-color: #eee;
    }
    .error {
      color: red;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <img src="fast-video-nero_page-0001.jpg" alt="Fast Video Produzioni Logo"/>

  <h2>Monitoraggio Iscritti Zoom</h2>

  <input type="password" id="password" placeholder="Inserisci la password"/>
  <button onclick="caricaDati()">Accedi</button>

  <div class="error" id="errore"></div>
  <div id="tabella"></div>

  <script>
    const PASSWORD_CORRETTA = "fastvideo2025";
    async function caricaDati() {
      const pwd = document.getElementById("password").value;
      const errore = document.getElementById("errore");
      const tabellaDiv = document.getElementById("tabella");

      errore.innerText = "";
      tabellaDiv.innerHTML = "";

      if (pwd !== PASSWORD_CORRETTA) {
        errore.innerText = "Password errata.";
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        errore.innerText = "ID del webinar mancante nell'URL.";
        return;
      }

      try {
        const response = await fetch(`https://zoom-backend-la4b.onrender.com/api/registrants?id=${id}`);
        if (!response.ok) throw new Error("Errore nel recupero dei dati dal backend.");
        const data = await response.json();

        if (!Array.isArray(data)) {
          errore.innerText = "Formato dei dati inatteso.";
          return;
        }

        let html = "<table><tr><th>Nome</th><th>Cognome</th><th>Email</th><th>Link personale</th></tr>";
        for (const r of data) {
          html += `<tr>
            <td>${r.first_name || ""}</td>
            <td>${r.last_name || ""}</td>
            <td>${r.email || ""}</td>
            <td><a href="${r.join_url}" target="_blank">Partecipa</a></td>
          </tr>`;
        }
        html += "</table>";
        tabellaDiv.innerHTML = html;
      } catch (err) {
        errore.innerText = "Errore nel recupero dei dati dal backend.";
      }
    }
  </script>

</body>
</html>
